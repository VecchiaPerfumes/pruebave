<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mau el Manco: El Juego</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1b1035;
    background-image:
      linear-gradient(45deg, #150c2a 25%, transparent 25%),
      linear-gradient(-45deg, #150c2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #150c2a 75%),
      linear-gradient(-45deg, transparent 75%, #150c2a 75%);
    background-size: 40px 40px;
    background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    color: #e8def5;
    padding: 20px;
    gap: 16px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 28px);
    color: #ff5c5c;
    text-shadow: 3px 3px 0 #7a0000, 6px 6px 0 rgba(0,0,0,0.4);
    text-align: center;
    letter-spacing: 1px;
  }

  h1 .g { color: #7bd94f; text-shadow: 3px 3px 0 #245012, 6px 6px 0 rgba(0,0,0,0.4); }

  .hint {
    font-size: 20px;
    color: #c9b8ff;
    text-align: center;
  }

  #gameWrap {
    position: relative;
    border: 6px solid #000;
    box-shadow: 0 0 0 6px #7c4dff, 10px 10px 0 rgba(0,0,0,0.5);
    background: #87CEEB;
    image-rendering: pixelated;
  }

  canvas {
    display: block;
    background: linear-gradient(#8fd3f4, #b8e6ff 70%, #b8e6ff 100%);
  }

  .hud {
    position: absolute;
    top: 10px;
    left: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #2b1a4a;
    text-shadow: 1px 1px 0 #fff;
  }

  .hud div { margin-bottom: 4px; }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 8, 40, 0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  #overlay h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: #ffd23f;
    text-shadow: 2px 2px 0 #7a5200;
  }

  #overlay p { font-size: 20px; color: #e8def5; max-width: 320px; }

  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: #7bd94f;
    color: #14320a;
    border: 4px solid #000;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    padding: 12px 20px;
    cursor: pointer;
  }

  button:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  }

  .footer-note {
    font-size: 18px;
    color: #7d6ba8;
  }
</style>
</head>
<body>

  <h1>MAU EL <span class="g">MANCO</span><br>DE MINECRAFT</h1>
  <p class="hint">Toca la pantalla / SPACE para saltar — pero Mau a veces se tropieza solo, así es él</p>

  <div id="gameWrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div class="hud">
      <div id="scoreLine">PUNTOS: 0</div>
      <div id="bestLine">RÉCORD: 0</div>
    </div>
    <div id="overlay">
      <h2>MAU SE CAYÓ</h2>
      <p id="deathMsg">Como siempre, manco hasta el final.</p>
      <button id="startBtn">JUGAR</button>
    </div>
  </div>

  <p class="footer-note">confirmado por la comunidad científica</p>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const groundY = H - 40;

  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreLine = document.getElementById('scoreLine');
  const bestLine = document.getElementById('bestLine');
  const deathMsg = document.getElementById('deathMsg');

  let best = 0;

  const stumbleLines = [
    "Como siempre, manco hasta el final.",
    "Confundió el espacio con el pico.",
    "Se resbaló con un bloque de aire.",
    "Intentó esquivar y saltó al revés.",
    "Clásico Mau: cero coordinación.",
    "Le ganó un creeper caminando."
  ];

  let player, obstacles, particles, speed, score, gameOver, running, spawnTimer, groundOffset;

  function resetGame() {
    player = {
      x: 60, y: groundY - 28, w: 24, h: 28,
      vy: 0, jumping: false, stumbling: false, stumbleTimer: 0
    };
    obstacles = [];
    particles = [];
    speed = 3.2;
    score = 0;
    gameOver = false;
    running = true;
    spawnTimer = 60;
    groundOffset = 0;
    overlay.classList.add('hidden');
  }

  function jump() {
    if (!running) return;
    if (!player.jumping && !player.stumbling) {
      // 12% chance Mau simplemente falla el salto (manco moment)
      if (Math.random() < 0.12) {
        player.stumbling = true;
        player.stumbleTimer = 22;
      } else {
        player.jumping = true;
        player.vy = -6.6;
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); jump(); }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });

  function spawnObstacle() {
    const type = Math.random() < 0.5 ? 'creeper' : 'lava';
    if (type === 'creeper') {
      obstacles.push({ type, x: W + 10, y: groundY - 26, w: 22, h: 26 });
    } else {
      obstacles.push({ type, x: W + 10, y: groundY - 10, w: 34, h: 10 });
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    if (!running) return;

    groundOffset = (groundOffset + speed) % 16;
    speed += 0.0025;

    // player physics
    if (player.stumbling) {
      player.stumbleTimer--;
      if (player.stumbleTimer <= 0) player.stumbling = false;
    } else if (player.jumping) {
      player.vy += 0.38;
      player.y += player.vy;
      if (player.y >= groundY - player.h) {
        player.y = groundY - player.h;
        player.jumping = false;
        player.vy = 0;
      }
    }

    // spawn obstacles
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(38, 75 - Math.floor(score / 4));
    }

    // move obstacles
    for (const o of obstacles) o.x -= speed;
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // collision (stumbling = no hitbox protection, guaranteed doom if obstacle near)
    const hitbox = { x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 6 };
    for (const o of obstacles) {
      const obox = o.type === 'creeper'
        ? { x: o.x + 3, y: o.y + 2, w: o.w - 6, h: o.h - 2 }
        : { x: o.x, y: o.y, w: o.w, h: o.h };
      if (rectsOverlap(hitbox, obox)) {
        endGame();
        break;
      }
    }

    score += 0.06;
    scoreLine.textContent = 'PUNTOS: ' + Math.floor(score);
  }

  function endGame() {
    running = false;
    gameOver = true;
    best = Math.max(best, Math.floor(score));
    bestLine.textContent = 'RÉCORD: ' + best;
    deathMsg.textContent = stumbleLines[Math.floor(Math.random() * stumbleLines.length)];
    overlay.classList.remove('hidden');
  }

  function drawGround() {
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#5cb636';
    ctx.fillRect(0, groundY, W, 6);
    ctx.fillStyle = '#4da62c';
    for (let x = -16 + -groundOffset; x < W; x += 16) {
      ctx.fillRect(x, groundY, 8, 6);
    }
  }

  function drawPlayer() {
    ctx.save();
    let px = player.x, py = player.y;
    if (player.stumbling) {
      ctx.translate(px + player.w / 2, py + player.h / 2);
      ctx.rotate(0.9);
      ctx.translate(-(px + player.w / 2), -(py + player.h / 2));
      py += 6;
    }
    // body (steve-ish)
    ctx.fillStyle = '#3b6ea5';
    ctx.fillRect(px + 4, py + 12, 16, 14);
    ctx.fillStyle = '#e0a97a';
    ctx.fillRect(px + 6, py, 12, 12);
    ctx.fillStyle = '#4a2f1c';
    ctx.fillRect(px + 6, py, 12, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 8, py + 5, 2, 2);
    ctx.fillRect(px + 14, py + 5, 2, 2);
    ctx.fillStyle = '#274b73';
    ctx.fillRect(px + 4, py + 24, 6, 4);
    ctx.fillRect(px + 14, py + 24, 6, 4);
    ctx.restore();
  }

  function drawObstacle(o) {
    if (o.type === 'creeper') {
      ctx.fillStyle = '#5cb636';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(o.x + 3, o.y + 4, 5, 5);
      ctx.fillRect(o.x + 13, o.y + 4, 5, 5);
      ctx.fillRect(o.x + 8, o.y + 10, 6, 10);
    } else {
      ctx.fillStyle = '#ff5c1a';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = '#ffcf3f';
      for (let i = 0; i < o.w; i += 6) {
        ctx.fillRect(o.x + i, o.y - 2, 3, 3);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGround();
    for (const o of obstacles) drawObstacle(o);
    drawPlayer();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', resetGame);

  resetGame();
  running = false;
  overlay.classList.remove('hidden');
  deathMsg.textContent = 'Ayuda a Mau a no tropezarse con el aire.';
  document.querySelector('#overlay h2').textContent = 'MAU EL MANCO';

  loop();
})();
</script>

</body>
</html>
